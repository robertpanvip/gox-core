name: Release

# 打 v* tag 时交叉编译 gox 并发布预编译二进制。
# 产物命名与 scripts/install.sh / install.ps1 严格对应：
#   gox_<tag>_<os>_<arch>.tar.gz（Windows 为 .zip）+ checksums.txt
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          BIN=gox
          if [ "$GOOS" = windows ]; then BIN=gox.exe; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BIN}" ./cmd/gox

          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "../gox_${VERSION}_${GOOS}_${GOARCH}.zip" "${BIN}")
          else
            tar -czf "gox_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C dist "${BIN}"
          fi
          ls -lh gox_${VERSION}_${GOOS}_${GOARCH}.*

      - uses: actions/upload-artifact@v4
        with:
          name: gox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
